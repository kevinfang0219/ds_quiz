<!DOCTYPE html>
<html>
<head>
    <title>登入測驗系統</title>
    <style>
        /* 與註冊頁面相同的 CSS 樣式，用來對齊表單 */
        .form-container {
            display: inline-block;
            text-align: left; /* 讓表單內的文字靠左，方便對齊 */
            margin: 0 auto;
        }
        
        .form-container p {
            margin-bottom: 15px;
        }

        .form-container label {
            display: inline-block;
            width: 100px; /* 固定所有標題的寬度 */
            text-align: right; /* 標題文字靠右，貼齊輸入框 */
            margin-right: 10px;
            vertical-align: top;
            font-weight: bold;
        }

        .form-container input {
            padding: 5px;
            width: 250px;
            box-sizing: border-box;
        }
    </style>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">

    <h2>歡迎進入資料結構測驗系統</h2>
    <p>請先登入您的專屬帳號，以追蹤錯題歷史</p>

    {% if form.errors %}
        <p style="color: red;">帳號或密碼錯誤，請重新輸入。</p>
    {% endif %}

    <div class="form-container">
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" style="padding: 10px 20px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                    登入系統
                </button>
            </div>
        </form>
    </div>
    
    <hr style="max-width: 300px; margin: 30px auto;">
    
    <p>還沒有帳號嗎？</p>
    <a href="{% url 'register' %}" style="display: inline-block; padding: 10px 20px; background-color: #10b981; color: white; text-decoration: none; border-radius: 5px;">
        點我註冊新帳號
    </a>

</body>
</html>
